name: Mobile acceptance
on: [push, workflow_dispatch]
permissions:
  contents: read

jobs:
  mobile:
    name: Mobile ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps "${{ matrix.browser }}"
      - run: python qa/mobile_acceptance.py . "${{ matrix.browser }}"
      - run: python qa/family-browser.py . "${{ matrix.browser }}"
