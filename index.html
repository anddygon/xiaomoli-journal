<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f4ee"><link rel="manifest" href="manifest.webmanifest"><title>小茉莉日记</title><style>
:root{--bg:#f5f4ee;--paper:#fffefa;--ink:#2d4435;--sage:#66836b;--muted:#899489;--line:#e9ebe3}*{box-sizing:border-box}body{margin:0 auto;max-width:680px;padding:env(safe-area-inset-top) 18px 100px;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:22px 2px}h1{font:600 24px Georgia,serif;margin:5px 0}small,.muted{color:var(--muted)}.hero{padding:23px;border-radius:24px;background:linear-gradient(130deg,#e8efe4,#f3efe5);margin-bottom:22px}.hero h2{font:600 22px Georgia,serif}.stats,.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats article,.quick button,.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:15px}.stats article{display:grid;gap:7px}.stats strong{font-size:20px}.quick{grid-template-columns:repeat(3,1fr)}button{cursor:pointer}.quick button{border-radius:17px;min-height:88px;color:var(--sage);font-size:22px}.quick span{display:block;font-size:12px;margin-top:7px;color:var(--ink)}.section{margin:22px 2px 11px;font-weight:600}.item{display:grid;grid-template-columns:48px 14px 1fr;gap:8px;padding:13px 0;border-bottom:1px solid #eee}.time{font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#9caf98;margin:4px auto}.detail{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:8px}.actions button{border:0;background:none;color:var(--sage);font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fffefaee;backdrop-filter:blur(16px);padding:12px 5px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}nav button{border:0;background:none;color:var(--sage);font-size:12px}dialog{border:0;border-radius:22px 22px 0 0;width:min(100%,680px);margin:auto auto 0;padding:22px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#25352b77}label{display:block;margin:13px 0;font-size:12px;color:var(--muted)}input,select{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin-top:6px;background:#fafaf6} .primary{background:var(--sage);color:white;border:0;border-radius:13px;padding:14px;width:100%;margin-top:12px}
</style></head><body>
<header><div><small>OUR LITTLE WORLD</small><h1>小茉莉日记 🌼</h1><small id="age">记录成长的每一天</small></div><div>🌼</div></header>
<section class="hero"><small id="date"></small><h2>今天也要快乐长大</h2><p class="muted">每一份小小记录，都是爱的陪伴。</p><b id="count">0 条记录</b></section>
<div class="section">今日概览</div><div class="stats"><article>🍼 <strong id="feeds">0 次</strong><small>喂养</small></article><article>💤 <strong id="sleeps">0 次</strong><small>睡眠</small></article><article>💧 <strong id="pees">0 次</strong><small>尿尿</small></article><article>🌱 <strong id="poops">0 次</strong><small>便便</small></article></div>
<div class="section">快速记录</div><div class="quick"><button data-t="喂奶">🍼<span>喂奶</span></button><button data-t="睡眠">🌙<span>睡眠</span></button><button data-t="尿尿">💧<span>尿尿</span></button><button data-t="便便">🌱<span>便便</span></button><button data-t="用药">💊<span>用药</span></button><button data-t="营养品">🧡<span>营养品</span></button></div>
<div class="section">今天的记录 <small>· 仅保存在本机</small></div><div class="panel" id="list"></div>
<nav><button>⌂ 首页</button><button onclick="document.getElementById('profile').showModal()">☺ 宝宝档案</button><button onclick="exportData()">⇩ 导出备份</button></nav>
<dialog id="entry"><form id="form"><h2 id="title">添加记录</h2><label>发生时间<input name="time" type="time" required></label><div id="extra"></div><button class="primary">保存记录</button></form></dialog>
<dialog id="profile"><form id="pf"><h2>宝宝档案</h2><label>宝宝昵称<input name="name" placeholder="小茉莉"></label><label>出生日期<input name="birth" type="date"></label><label>性别<select name="sex"><option>未填写</option><option>女</option><option>男</option></select></label><button class="primary">保存</button></form></dialog>
<script>
const key='xiaomoli-demo-records',pk='xiaomoli-demo-profile';let records=JSON.parse(localStorage.getItem(key)||'[]'),kind='';
const $=s=>document.querySelector(s);$('#date').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
function render(){let d=new Date().toLocaleDateString('en-CA'),a=records.filter(x=>x.date===d);$('#count').textContent=a.length+' 条记录';[['喂奶','feeds'],['睡眠','sleeps'],['尿尿','pees'],['便便','poops']].forEach(([t,id])=>$('#'+id).textContent=a.filter(x=>x.type===t).length+' 次');$('#list').innerHTML=a.slice().reverse().map(x=>'<div class="item"><div class="time">'+x.time+'</div><div class="dot"></div><div><b>'+x.type+'</b><div class="detail">'+(x.detail||'')+' · '+x.actor+'</div><div class="actions"><button data-del="'+x.id+'">删除</button></div></div></div>').join('')||'<p class="muted">今天还没有记录</p>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('确定删除这条记录？')){records=records.filter(x=>x.id!==b.dataset.del);save()}})}
function save(){localStorage.setItem(key,JSON.stringify(records));render()}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{kind=b.dataset.t;$('#title').textContent='记录'+kind;$('#extra').innerHTML=kind==='喂奶'?'<label>方式<select name="method"><option>母乳</option><option>奶粉</option><option>混合喂养</option></select></label><label>侧别<select name="side"><option>双侧</option><option>左侧</option><option>右侧</option></select></label><label>奶量（ml）<input name="volume" type="number"></label>':kind==='便便'?'<label>性状<select name="texture"><option>糊状</option><option>成形</option><option>稀便</option><option>水样</option></select></label>':kind==='用药'||kind==='营养品'?'<label>名称<input name="name" required></label><label>剂量<input name="dose"></label>':'';$('#form [name=time]').value=new Date().toTimeString().slice(0,5);$('#entry').showModal()});
$('#form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),d=new Date().toLocaleDateString('en-CA'),detail=[f.get('method'),f.get('side'),f.get('volume')&&f.get('volume')+'ml',f.get('texture'),f.get('name'),f.get('dose')].filter(Boolean).join(' · ');records.push({id:crypto.randomUUID(),date:d,time:f.get('time'),type:kind,detail,actor:'爸爸'});save();$('#entry').close();e.target.reset()};
$('#pf').onsubmit=e=>{e.preventDefault();localStorage.setItem(pk,JSON.stringify(Object.fromEntries(new FormData(e.target))));$('#profile').close();alert('宝宝档案已保存（本机）')};
function exportData(){let b=new Blob([JSON.stringify({records,profile:JSON.parse(localStorage.getItem(pk)||'{}')},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='小茉莉日记备份.json';a.click();URL.revokeObjectURL(a.href)}
let p=JSON.parse(localStorage.getItem(pk)||'{}');$('#age').textContent=p.name?(p.name+' · '+(p.birth||'')):'记录成长的每一天';render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
